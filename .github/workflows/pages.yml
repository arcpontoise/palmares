# Génère le site statique à partir de detail_pontoise.csv (commité) et le
# publie sur GitHub Pages. Aucun accès à la FFTA ici : le CSV est produit en
# local par palmares_pontoise.py puis poussé sur le dépôt.
name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - detail_pontoise.csv
      - membres.yaml
      - generer_site.py
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 generer_site.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
